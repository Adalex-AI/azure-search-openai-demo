name: Python check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".azdo/**"
      - ".devcontainer/**"
      - ".github/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".azdo/**"
      - ".devcontainer/**"
      - ".github/**"
  workflow_call:

jobs:
  test_package:
    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }} Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        node_version: ["20.19", "22"]
    steps:
        - uses: actions/checkout@v6
          with:
            # Fetch full history so diff-cover can compute a merge base with origin/main
            fetch-depth: 0
            sparse-checkout: |
              /*
              !/data/legal-scraper/processed/html_cache/
            sparse-checkout-cone-mode: false
        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
            enable-cache: true
            version: "0.9.5"
            cache-dependency-glob: "requirements**.txt"
            python-version: ${{ matrix.python_version }}
            activate-environment: true
        - name: Setup node
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.node_version }}
        - name: Build frontend
          run: |
            cd ./app/frontend
            npm install
            npm run build
        - name: Check i18n translations
          run: npx -y @lingual/i18n-check@0.8.12 --locales app/frontend/src/locales -s en -f i18next -r summary
        - name: Install dependencies
          run: |
            uv pip install -r requirements-dev.txt
        - name: Lint with ruff
          shell: bash
          run: |
            changed_python_files=()
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
              mapfile -t changed_python_files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
            elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              mapfile -t changed_python_files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}...HEAD" -- '*.py')
            else
              mapfile -t changed_python_files < <(git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r HEAD -- '*.py')
            fi
            if [ "${#changed_python_files[@]}" -gt 0 ]; then
              ruff check "${changed_python_files[@]}"
            else
              echo "No changed Python files to lint."
            fi
        - name: Check types with ty
          shell: bash
          run: |
            changed_backend_files=()
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              changed_files_range="origin/${{ github.base_ref }}...HEAD"
              git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
              mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMR "$changed_files_range" -- '*.py')
            elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}...HEAD" -- '*.py')
            else
              mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r HEAD -- '*.py')
            fi
            for file in "${changed_files[@]}"; do
              case "$file" in
                app/backend/*.py|app/backend/**/*.py)
                  changed_backend_files+=("$file")
                  ;;
              esac
            done
            if [ "${#changed_backend_files[@]}" -gt 0 ]; then
              ty check "${changed_backend_files[@]}"
            else
              echo "No changed backend Python files to type-check."
            fi
        - name: Check formatting with black
          shell: bash
          run: |
            changed_python_files=()
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
              mapfile -t changed_python_files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
            elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              mapfile -t changed_python_files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}...HEAD" -- '*.py')
            else
              mapfile -t changed_python_files < <(git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r HEAD -- '*.py')
            fi
            if [ "${#changed_python_files[@]}" -gt 0 ]; then
              black "${changed_python_files[@]}" --check --verbose
            else
              echo "No changed Python files to format-check."
            fi
        - name: Run Python tests
          if: runner.os != 'Windows'
          run: pytest tests --ignore=tests/adhoc -s -vv --cov --cov-report=xml --cov-fail-under=90
        - name: Check diff coverage
          if: runner.os != 'Windows'
          run: |
            BASE_REF="${{ github.base_ref }}"
            if [ -z "$BASE_REF" ]; then BASE_REF="main"; fi
            git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=90
        - name: Run E2E tests with Playwright
          id: e2e
          if: runner.os != 'Windows'
          run: |
            playwright install chromium --with-deps
            pytest tests/e2e.py --tracing=retain-on-failure
        - name: Upload test artifacts
          if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
          uses: actions/upload-artifact@v7
          with:
            name: playwright-traces${{ matrix.python_version }}
            path: test-results
