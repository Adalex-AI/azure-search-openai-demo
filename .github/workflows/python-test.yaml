name: Python check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".azdo/**"
      - ".devcontainer/**"
      - ".github/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".azdo/**"
      - ".devcontainer/**"
      - ".github/**"
  workflow_call:

jobs:
  test_package:
    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }} Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        node_version: ["20.19", "22"]
    steps:
        - uses: actions/checkout@v6
          with:
            # Fetch full history so diff-cover can compute a merge base with origin/main
            fetch-depth: 0
        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
            enable-cache: true
            version: "0.9.5"
            cache-dependency-glob: "requirements**.txt"
            python-version: ${{ matrix.python_version }}
            activate-environment: true
        - name: Setup node
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.node_version }}
        - name: Build frontend
          run: |
            cd ./app/frontend
            npm install
            npm run build
        - name: Check i18n translations
          run: npx -y @lingual/i18n-check@0.8.12 --locales app/frontend/src/locales -s en -f i18next -r summary
        - name: Install dependencies
          run: |
            uv pip install -r requirements-dev.txt
        - name: Find changed Python files
          id: changed-files
          shell: bash
          run: |
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="origin/${{ github.base_ref }}"
            else
              base="${{ github.event.before }}"
              if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
                base="HEAD^"
              fi
            fi
            git diff --name-only --diff-filter=ACMR -z "${base}" HEAD -- '*.py' > "${RUNNER_TEMP}/changed-python-files"
            if git diff --quiet "${base}" HEAD -- app/frontend/; then
              echo "frontend=false" >> "${GITHUB_OUTPUT}"
            else
              echo "frontend=true" >> "${GITHUB_OUTPUT}"
            fi
        - name: Lint with ruff
          shell: bash
          run: xargs -0 -r ruff check < "${RUNNER_TEMP}/changed-python-files"
        - name: Check formatting with black
          shell: bash
          run: xargs -0 -r black --check --verbose < "${RUNNER_TEMP}/changed-python-files"
        - name: Run Python tests
          if: runner.os != 'Windows'
          run: >-
            pytest -s -vv
            tests/test_build_v4_evidence_bundle.py
            tests/test_promote_v4_candidate.py
            tests/test_run_v4_application_gates.py
            tests/test_upload_v4_staging.py
            tests/test_validate_v4_candidate.py
            --cov --cov-report=xml
        - name: Check diff coverage
          if: runner.os != 'Windows'
          run: |
            BASE_REF="${{ github.base_ref }}"
            if [ -z "$BASE_REF" ]; then BASE_REF="main"; fi
            git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=90
        - name: Run E2E tests with Playwright
          id: e2e
          if: runner.os != 'Windows' && steps.changed-files.outputs.frontend == 'true'
          run: |
            playwright install chromium --with-deps
            pytest tests/e2e.py --tracing=retain-on-failure
        - name: Upload test artifacts
          if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
          uses: actions/upload-artifact@v7
          with:
            name: playwright-traces${{ matrix.python_version }}
            path: test-results
